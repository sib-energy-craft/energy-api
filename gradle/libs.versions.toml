[versions]
java = "25"

minecraft = "26.2"
loader = "0.19.3"

fabricmc = "0.157.0+26.2"
fabricmc-loom = "1.17-SNAPSHOT"

lombok = "1.18.46"
junit-jupiter = "6.1.3"
mockito = "5.23.0"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricmc" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabricmc-loom" }

[bundles]
testing = ["junit-jupiter-api", "junit-jupiter-params", "mockito"]
